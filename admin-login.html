<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login | Kopersay</title><link rel="icon" type="image/png" href="assets/kopersay2.png">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:Inter,Arial,sans-serif;color:#111827}.box{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:32px;box-shadow:0 18px 50px rgba(17,24,39,.09)}.brand{text-align:center}.brand img{width:58px;height:58px;object-fit:contain}.brand-name{font-size:22px;font-weight:800;margin-top:8px}.brand-name .a{color:#1677ff}.sub{text-align:center;color:#6b7280;margin:7px 0 28px}.field{margin-bottom:17px}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}.field input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font:inherit}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:#1677ff;color:white;font-weight:800;font-size:15px;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.error{display:none;margin-top:14px;padding:11px;border-radius:9px;background:#fef2f2;color:#b91c1c;font-size:13px}.success{display:none;margin-top:14px;padding:11px;border-radius:9px;background:#ecfdf5;color:#047857;font-size:13px}.notice{margin-top:20px;font-size:12px;color:#6b7280;text-align:center;line-height:1.5}.back{display:block;text-align:center;margin-top:18px;color:#374151;text-decoration:none;font-size:13px}</style>
<script src="cache-register.js"></script><link rel="stylesheet" href="water-glass.css"><link rel="stylesheet" href="mobile-fix.css">
</head><body><main class="box"><div class="brand"><img src="assets/kopersay2.png" alt="Kopersay Technologies Logo"><div class="brand-name">Kopers<span class="a">a</span>y</div></div><p class="sub">Source Code Admin</p><form id="login"><div class="field"><label for="email">Admin Email</label><input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Enter password"></div><button class="btn" id="submitBtn" type="submit">Sign In</button><div id="error" class="error"></div><div id="success" class="success">Login successful. Opening Admin Panel...</div></form><div class="notice">Authentication is handled by Firebase. Do not put passwords or private keys in this website code.</div><a class="back" href="source-code.html">← Back to Marketplace</a></main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyBSCSPWRpzwAicmZlW3KwEQmxTsUWmhBrI',authDomain:'kopersay-source-marketplace.firebaseapp.com',projectId:'kopersay-source-marketplace',storageBucket:'kopersay-source-marketplace.firebasestorage.app',messagingSenderId:'353556914299',appId:'1:353556914299:web:331230289d34360567c2de'};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const form=document.getElementById('login');const error=document.getElementById('error');const success=document.getElementById('success');const btn=document.getElementById('submitBtn');
onAuthStateChanged(auth,user=>{if(user){window.location.replace('admin-source-code.html');}});
form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';success.style.display='none';btn.disabled=true;try{await signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('password').value);success.style.display='block';}catch(err){error.textContent=err.code==='auth/invalid-credential'?'Email or password is incorrect.':err.code==='auth/too-many-requests'?'Too many attempts. Please try again later.':err.message;error.style.display='block';btn.disabled=false;}});
</script></body></html>
