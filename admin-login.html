<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login | Kopersay</title><link rel="icon" type="image/png" href="assets/kopersay2.png">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:Inter,Arial,sans-serif;color:#111827}.box{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:32px;box-shadow:0 18px 50px rgba(17,24,39,.09)}.brand{text-align:center}.brand img{width:58px;height:58px;object-fit:contain}.brand-name{font-size:22px;font-weight:800;margin-top:8px}.brand-name .a{color:#1677ff}.sub{text-align:center;color:#6b7280;margin:7px 0 28px}.field{margin-bottom:17px}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}.field input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font:inherit}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:#1677ff;color:white;font-weight:800;font-size:15px;cursor:pointer}.error{display:none;margin-top:14px;padding:11px;border-radius:9px;background:#fef2f2;color:#b91c1c;font-size:13px}.notice{margin-top:20px;font-size:12px;color:#6b7280;text-align:center;line-height:1.5}.back{display:block;text-align:center;margin-top:18px;color:#374151;text-decoration:none;font-size:13px}</style>
    <script src="cache-register.js"></script>
</head><body><main class="box"><div class="brand"><img src="assets/kopersay2.png" alt="Kopersay Technologies Logo"><div class="brand-name">Kopers<span class="a">a</span>y</div></div><p class="sub">Source Code Admin</p><form id="login"><div class="field"><label for="email">Admin Email</label><input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Enter password"></div><button class="btn" type="submit">Sign In</button><div id="error" class="error">Login is not connected to a backend yet.</div></form><div class="notice">This screen is only the frontend login UI. Real authentication must be handled by the server before this panel is used for production.</div><a class="back" href="source-code.html">← Back to Marketplace</a></main>
<script>document.getElementById('login').addEventListener('submit',function(e){e.preventDefault();document.getElementById('error').style.display='block';});</script></body></html>
