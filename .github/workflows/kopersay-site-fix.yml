name: Standardize Kopersay Site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  standardize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Standardize branding and navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          LOGO = '<img src="assets/kopersay2.png" alt="Kopersay Technologies Logo">'

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              def nav_fix(match):
                  nav = match.group(0)
                  pattern = r'(<a\b[^>]*href=["\']index\.html["\'][^>]*class=["\'][^"\']*(?:brand|logo)[^"\']*["\'][^>]*>).*?(</a>)'
                  nav = re.sub(pattern, lambda m: m.group(1) + LOGO + m.group(2), nav, flags=re.I|re.S)
                  return nav

              text = re.sub(r'<nav\b.*?</nav>', nav_fix, text, flags=re.I|re.S)

              def footer_brand_fix(match):
                  block = match.group(0)
                  block = re.sub(r'(<div\b[^>]*class=["\'][^"\']*(?:footer-logo|footer-brand)[^"\']*["\'][^>]*>).*?(</div>)',
                                 lambda m: m.group(1) + LOGO + m.group(2), block, count=1, flags=re.I|re.S)
                  return block

              text = re.sub(r'<footer\b.*?</footer>', footer_brand_fix, text, flags=re.I|re.S)

              if '/* KOPERSAY SHARED BRANDING */' not in text:
                  css = '''\n/* KOPERSAY SHARED BRANDING */\n.brand img, .logo img { height:48px; width:auto; display:block; }\n.footer-logo img, .footer-brand img { height:45px; width:auto; display:block; margin:0 auto 10px; }\n.nav-links { gap:0 !important; }\n.nav-links > a { margin-right:28px; white-space:nowrap; }\n.nav-links > a:last-child { margin-right:0; }\n@media (max-width:850px) {\n  .brand img, .logo img { height:40px; }\n  .nav-links { gap:0 !important; }\n  .nav-links > a { margin-right:0; }\n}\n'''
                  text = text.replace('</style>', css + '</style>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')

          bad = Path('<a href="wms-inward.html" class="module-btn">     Explore Inward & GRN → </wms-outward.html>')
          if bad.exists():
              bad.unlink()

          import subprocess
          subprocess.run(['git', 'config', 'user.name', 'Kopersay Site Bot'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          result = subprocess.run(['git', 'diff', '--cached', '--quiet'])
          if result.returncode != 0:
              subprocess.run(['git', 'commit', '-m', 'Standardize Kopersay branding and navigation [skip ci]'], check=True)
              subprocess.run(['git', 'push'], check=True)
