name: Add Source Code navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-navbar:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add Source Code link
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '<a href="source-code.html">Source Code</a>'
          if link not in s:
              marker = '<a href="apps.html">Apps</a>'
              if marker not in s:
                  raise SystemExit('Navbar marker not found; no changes made.')
              s = s.replace(marker, marker + link, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Source Code link already present."
            exit 0
          fi
          git commit -m "Add Source Code link to navbar"
          git push
