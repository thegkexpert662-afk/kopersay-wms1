name: Add Social Media Links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-social-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Place social row above footer copyright
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          instagram = 'https://www.instagram.com/kopersaytech?stkn=MXVxbXJsZ2hpeW1uYg=='
          youtube = 'https://youtube.com/@kopersaytech?si=9l9ObxGl1pVYXcCi'
          row_marker = 'data-kopersay-social-row="true"'
          old_marker = 'data-kopersay-instagram="true"'

          icons = {
              'instagram': '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></svg>',
              'facebook': '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 8h3V4h-3c-3.3 0-5 2-5 5v3H6v4h3v4h4v-4h3.2l.8-4H13V9c0-.7.3-1 1-1z"/></svg>',
              'youtube': '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23 12s0-3.4-.4-5a2.8 2.8 0 0 0-2-2C18.9 4.5 12 4.5 12 4.5s-6.9 0-8.6.5a2.8 2.8 0 0 0-2 2C1 8.6 1 12 1 12s0 3.4.4 5a2.8 2.8 0 0 0 2 2c1.7.5 8.6.5 8.6.5s6.9 0 8.6-.5a2.8 2.8 0 0 0 2-2c.4-1.6.4-5 .4-5zM10 15.5v-7l6 3.5-6 3.5z"/></svg>'
          }

          def button(url, label, icon, active=False):
              extra = ' target="_blank" rel="noopener noreferrer"' if active else ' aria-disabled="true"'
              return f'<a href="{url}"{extra} aria-label="{label}" style="display:inline-flex;align-items:center;justify-content:center;gap:5px;margin:4px;padding:6px 9px;border-radius:999px;background:#f4f5f7;color:#333!important;font-size:10px;font-weight:700;line-height:1;text-decoration:none;opacity:{"1" if active else ".55"};">{icon}<span>{label}</span></a>'

          row = f'<div {row_marker} style="text-align:center;margin:8px 0 5px;">{button(instagram,"Instagram",icons["instagram"],True)}{button("#","Facebook",icons["facebook"])}{button(youtube,"YouTube",icons["youtube"],True)}</div>'

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              if path.name == 'navnita_slider_snippet.html':
                  continue
              text = path.read_text(encoding='utf-8')

              cleaned = re.sub(r'<a\b[^>]*' + re.escape(old_marker) + r'[^>]*>.*?</a>', '', text, flags=re.DOTALL)
              cleaned = re.sub(r'<div\b[^>]*' + re.escape(row_marker) + r'[^>]*>.*?</div>', '', cleaned, count=1, flags=re.DOTALL)

              if re.search(r'©\s*2026', cleaned):
                  cleaned = re.sub(r'©\s*2026', '© 2026', cleaned, count=1)
              elif re.search(r'&copy;\s*2026', cleaned, flags=re.I):
                  cleaned = re.sub(r'&copy;\s*2026', '© 2026', cleaned, count=1, flags=re.I)
              else:
                  standalone = re.search(r'(?:^|>)[\s\n]*©[\s\n]*(?=<|2026)', cleaned)
                  if standalone:
                      cleaned = cleaned[:standalone.start()] + cleaned[standalone.end():]
                  year = re.search(r'2026', cleaned)
                  if year:
                      cleaned = cleaned[:year.start()] + '© 2026' + cleaned[year.end():]

              anchor = re.search(r'©\s*2026', cleaned)
              if not anchor:
                  anchor = re.search(r'2026', cleaned)
              if not anchor:
                  anchor = re.search(r'(?i)All\s+Rights\s+Reserved\.?', cleaned)
              if anchor:
                  updated = cleaned[:anchor.start()] + row + '\n' + cleaned[anchor.start():]
              elif '</footer>' in cleaned:
                  updated = cleaned.replace('</footer>', row + '</footer>', 1)
              else:
                  continue

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.name)

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit website changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Kopersay YouTube link"
          git push origin HEAD:main
