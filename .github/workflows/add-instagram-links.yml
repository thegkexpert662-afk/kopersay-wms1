name: Add Instagram Links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-instagram-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Add Instagram button with logo to every website footer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          instagram = 'https://www.instagram.com/kopersaytech?stkn=MXVxbXJsZ2hpeW1uYg=='
          marker = 'data-kopersay-instagram="true"'
          icon = '''<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display:block"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></svg>'''
          link = f'''<a href="{instagram}" target="_blank" rel="noopener noreferrer" aria-label="Kopersay Technologies on Instagram" {marker} style="display:inline-flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;padding:9px 14px;border-radius:12px;background:linear-gradient(135deg,#6b45ee,#15afe9);color:#fff!important;font-size:13px;font-weight:700;text-decoration:none;box-shadow:0 8px 20px rgba(82,85,220,.22);">{icon}<span>Instagram</span></a>'''

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              if path.name == 'navnita_slider_snippet.html':
                  continue
              text = path.read_text(encoding='utf-8')

              if marker in text:
                  pattern = r'<a\b[^>]*' + re.escape(marker) + r'[^>]*>.*?</a>'
                  updated, count = re.subn(pattern, link, text, count=1, flags=re.DOTALL)
                  if count:
                      path.write_text(updated, encoding='utf-8')
                      changed.append(path.name)
                  continue

              if '</footer>' in text:
                  updated = text.replace('</footer>', link + '</footer>', 1)
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.name)

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit website changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Instagram logo to website buttons"
          git push origin HEAD:main
